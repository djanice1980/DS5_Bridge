# DS5 Bridge — expose the controller's four audio channels.
#
# ALSA ships a UCM profile for the Sony DualSense that assumes a real
# controller's stereo-only speaker. Applied to the DS5 Bridge it splits the
# device into a stereo "Speaker" sink that hides the two haptic channels and
# attenuates the speaker ~6 dB ("[ALSA UCM error]" in the node name).
#
# Forcing the plain ALSA card profile (ACP) instead gives one clean 4.0 sink:
# stereo maps to the front pair (FL/FR) at full level, and the rear pair
# (RL/RR) carries the haptics, which is what the companion writes into.
#
# Scoped by USB vendor/product id, not by name. "~alsa_card.*Controller.*" is a substring
# regex: it also matched a DualSense plugged straight into the PC, and any unrelated card with
# "Controller" in its name -- this file is installed system-wide, so a stray match changes a
# device the app has nothing to do with. The ids below are exactly the personas the bridge
# presents that carry audio (DualSense, DualSense Edge, DualShock 4); the Xbox 360 persona has
# no audio endpoint and the companion-only idle enumeration has no audio interface at all.
monitor.alsa.rules = [
  {
    matches = [
      { device.vendor.id = "0x054c", device.product.id = "0x0ce6" }
      { device.vendor.id = "0x054c", device.product.id = "0x0df2" }
      { device.vendor.id = "0x054c", device.product.id = "0x09cc" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.alsa.use-ucm = false
      }
    }
  }
]

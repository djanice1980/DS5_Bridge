name: Companion checks

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  companion:
    name: Typecheck, test, and build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Install companion dependencies
        working-directory: companion
        run: npm ci

      - name: Build audio helper
        working-directory: companion
        run: npm run build:audio-helper

      - name: Typecheck companion
        working-directory: companion
        run: npm run typecheck

      - name: Test companion
        working-directory: companion
        run: npm test

      - name: Build companion
        working-directory: companion
        run: npm run build:app

  companion-linux:
    name: Linux typecheck, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Install companion dependencies
        working-directory: companion
        run: npm ci

      - name: Build Linux audio helper
        working-directory: companion
        run: npm run build:audio-helper:linux

      - name: Typecheck companion
        working-directory: companion
        run: npm run typecheck

      - name: Test companion
        working-directory: companion
        run: npm run test:companion

      # The Linux backends (PipeWire, libusb, uinput) only exist in the net9.0 build, so this
      # job is the only place their tests can run at all.
      - name: Test Linux audio helper
        working-directory: companion
        run: npm run test:native

      # Host-compiled firmware logic tests; no ARM toolchain needed.
      - name: Install firmware test toolchain
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build

      - name: Test firmware logic
        working-directory: companion
        run: npm run test:firmware

      - name: Check firmware version is in sync
        run: node tools/check-firmware-version-sync.mjs

      - name: Build companion
        working-directory: companion
        run: npm run build:app
